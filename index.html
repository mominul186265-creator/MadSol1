    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        var isDev = window.location.hostname === 'localhost' ||
                    window.location.hostname === '127.0.0.1' ||
                    window.location.host.includes('ais-dev') ||
                    window.location.host.includes('.run.app');
        if (isDev) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var reg of registrations) {
              reg.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var key of keys) {
                caches.delete(key);
              }
            });
          }
        } else {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
              .then(function(reg) {
                console.log('MadSol Service Worker registered with scope:', reg.scope);
              })
              .catch(function(err) {
                console.warn('MadSol Service Worker registration failed:', err);
              });
          });
        }
      }
    </script>
    
    <!-- OpenGraph & Social Cards -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('madsol_theme');
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
