<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable icon -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Scaled content inside 80% safe zone (center 410x410) -->
  <g transform="translate(51, 51) scale(0.8)">
    <circle cx="256" cy="256" r="210" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="12 8" />
    <circle cx="256" cy="256" r="196" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4" />

    <!-- Central Mosque Dome Motif -->
    <path d="M 256 90 C 235 150 170 185 170 255 C 170 265 172 275 176 284 L 336 284 C 340 275 342 265 342 255 C 342 185 277 150 256 90 Z" fill="url(#emeraldGrad)" opacity="0.95" />
    
    <circle cx="256" cy="72" r="8" fill="url(#goldGrad)" />
    <path d="M 256 82 L 256 90" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />

    <path d="M 256 165 C 230 205 210 235 210 284 L 302 284 C 302 235 282 205 256 165 Z" fill="#064e3b" opacity="0.9" />

    <!-- Open Holy Quran / Book Symbol -->
    <path d="M 256 288 C 220 268 160 268 128 286 L 128 368 C 160 350 220 350 256 370 C 292 350 352 350 384 368 L 384 286 C 352 268 292 268 256 288 Z" fill="url(#goldGrad)" />
    <path d="M 256 288 L 256 370" stroke="#b45309" stroke-width="3.5" />

    <!-- Graduation Cap Tassel Hint -->
    <polygon points="256,220 320,240 256,260 192,240" fill="#fef08a" opacity="0.85" />
    <path d="M 314 242 L 328 270" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <circle cx="328" cy="272" r="4" fill="#f59e0b" />

    <!-- Brand Text -->
    <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="3">MADSOL</text>
    <text x="256" y="448" text-anchor="middle" font-family="'Hind Siliguri', system-ui, sans-serif" font-weight="600" font-size="20" fill="#34d399" letter-spacing="1">মাদ্রাসা সল্যুশন</text>
  </g>
</svg>
