name: Build MadSol Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 🛠️ Ensure Gradle Wrapper and Permissions
        working-directory: android
        run: |
          mkdir -p gradle/wrapper
          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading official gradle-wrapper.jar..."
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew || true

      - name: 🔨 Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: madsol-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
